# Build Autorun's SD card archive with build.sh, the way a developer's machine
# does: Docker runs the switch-dev image, the host configures Wine's tree.
name: Build

on:
  push:
    branches: [controls]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The host tests of the controls, which take seconds where the build takes hours.
  controls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bindings
        run: |
          flags="-std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          for cc in gcc clang; do
            $cc $flags horizon-wine/tests/pad_bindings.c -o /tmp/pad_bindings-$cc
            /tmp/pad_bindings-$cc
          done
      - name: Key names
        run: python3 horizon-wine/tests/check_key_names.py
      - name: Pointer cursor
        run: |
          clang -std=gnu11 -Wall -Wextra -Werror horizon-wine/tests/pointer_cursor.c -o /tmp/pointer_cursor
          /tmp/pointer_cursor

  autorun:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # One build at a time, the later waiting: a build cut short saves no cache.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Host tools for Wine's configure
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bison flex gettext build-essential

      # llvm-mingw and the Atmosphere boot payloads: build.sh fetches and
      # builds them only when they are missing, and they rarely change.
      - name: Toolchains cache
        uses: actions/cache@v4
        with:
          path: |
            horizon-wine/toolchains
          key: toolchains-${{ hashFiles('build.sh', 'horizon-wine/build-boot-bundle.sh', 'horizon-wine/switch-dev.txt') }}

      - name: Build
        run: sh build.sh --jobs "$(nproc)"

      - name: Disk left
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: autorun
          path: horizon-wine/build-autorun/autorun-*.zip
          if-no-files-found: error
